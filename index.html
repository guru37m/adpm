    <script>
document.addEventListener('DOMContentLoaded', function(){
  const el = document.getElementById('rotating-text');
  if(!el) return;

  const phrases = [
    "Diploma EJA em 90 dias",
    "Parcelas de Apenas R$74,90",
    "Estude sem sair de casa"
  ];

  // Respeita preferência do usuário por menos movimento
  const reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(reduceMotion){
    el.textContent = phrases[0];
    return;
  }

  let i = 0;        // índice da frase
  let j = 0;        // índice do caractere
  let deleting = false;

  const typeSpeed = 55;   // ms por caractere ao digitar
  const backSpeed = 38;   // ms por caractere ao apagar
  const holdTime  = 1700; // ms segurando a frase completa
  const gapTime   = 400;  // ms antes de começar a digitar a próxima

  function tick(){
    const current = phrases[i];

    if(!deleting){
      // digita
      el.textContent = current.slice(0, j + 1);
      j++;
      if(j === current.length){
        // segura a frase e depois começa a apagar
        setTimeout(() => { deleting = true; tick(); }, holdTime);
        return;
      }
      setTimeout(tick, typeSpeed);
    }else{
      // apaga
      el.textContent = current.slice(0, j - 1);
      j--;
      if(j === 0){
        deleting = false;
        i = (i + 1) % phrases.length;
        setTimeout(tick, gapTime);
        return;
      }
      setTimeout(tick, backSpeed);
    }
  }

  // inicia com a primeira frase já visível no HTML
  el.textContent = phrases[0];
  j = phrases[0].length;
  setTimeout(() => { deleting = true; tick(); }, holdTime);
});
</script>
